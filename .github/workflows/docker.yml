name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DH_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
      DH_IMAGE: 22321121/moviepilot
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          ver=$(sed -ne "s/APP_VERSION\s*=\s*'\(.*\)'/\1/gp" version.py | head -n 1)
          echo "ver=${ver}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.ver }}
          cache-from: type=gha,scope=moviepilot
          cache-to: type=gha,scope=moviepilot,mode=max

      - name: Login Docker Hub
        if: env.DH_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_PASS }}

      - name: Push Docker Hub
        if: env.DH_USER != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DH_IMAGE }}:latest
            ${{ env.DH_IMAGE }}:${{ env.ver }}
          cache-from: type=gha,scope=moviepilot

      - name: Source zip
        run: zip -qr /tmp/source.zip . -x ".git/*"

      - uses: actions/upload-artifact@v4
        with:
          name: moviepilot-source
          path: /tmp/source.zip