services:
  moviepilot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: moviepilot-mteamvip:local
    container_name: moviepilot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./config:/config
      - ./media:/media
    environment:
      - TZ=Asia/Shanghai
      - PUID=0
      - PGID=0
      - UMASK=000
      - MOVIEPILOT_AUTO_UPDATE=false